<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4d6c8"/>
      <stop offset="0.45" stop-color="#e8b9a8"/>
      <stop offset="1" stop-color="#d9a0b0"/>
    </linearGradient>
    <filter id="blur2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="soft2" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Cielo -->
  <rect width="1200" height="800" fill="url(#sky2)"/>

  <!-- Sol -->
  <g filter="url(#blur2)" opacity="0.7">
    <circle cx="900" cy="180" r="90" fill="#f7e6c8"/>
  </g>
  <circle cx="900" cy="180" r="55" fill="#f9ecd0" opacity="0.9"/>

  <!-- Montaña lejana -->
  <g filter="url(#soft2)" opacity="0.85">
    <path d="M0 520 L200 360 L380 420 L560 280 L740 360 L920 300 L1100 400 L1200 360 L1200 800 L0 800 Z" fill="#8a7a9a"/>
    <path d="M0 560 L180 420 L360 480 L540 340 L720 420 L900 360 L1080 460 L1200 420 L1200 800 L0 800 Z" fill="#6e6080" opacity="0.7"/>
  </g>

  <!-- Nieve en la cima -->
  <g opacity="0.85">
    <path d="M540 340 L560 320 L580 340 L600 325 L620 345 L540 340 Z" fill="#f7f0e8"/>
    <path d="M900 360 L920 340 L940 360 L900 360 Z" fill="#f7f0e8"/>
  </g>

  <!-- Colina cercana -->
  <g filter="url(#soft2)">
    <path d="M0 620 Q300 580 600 610 T1200 600 L1200 800 L0 800 Z" fill="#7a8f7b"/>
    <path d="M0 660 Q400 630 800 660 T1200 640 L1200 800 L0 800 Z" fill="#6b7f6c" opacity="0.8"/>
  </g>

  <!-- Árboles pequeños -->
  <g opacity="0.7">
    <ellipse cx="220" cy="600" rx="18" ry="28" fill="#4f6b4f"/>
    <ellipse cx="260" cy="610" rx="14" ry="22" fill="#5a7a5a"/>
    <ellipse cx="980" cy="610" rx="20" ry="30" fill="#4f6b4f"/>
    <ellipse cx="1020" cy="620" rx="16" ry="24" fill="#5a7a5a"/>
  </g>

  <!-- Dos enamorados (siluetas) -->
  <g fill="#2a241d" opacity="0.85">
    <!-- Persona 1 (izquierda) -->
    <circle cx="540" cy="560" r="16"/>
    <rect x="528" y="576" width="24" height="40" rx="6"/>
    <!-- brazo hacia la otra -->
    <rect x="552" y="582" width="6" height="26" rx="3" transform="rotate(25 552 582)"/>
    <!-- piernas -->
    <rect x="530" y="616" width="8" height="30" rx="3" transform="rotate(-6 530 616)"/>
    <rect x="546" y="616" width="8" height="30" rx="3" transform="rotate(6 546 616)"/>

    <!-- Persona 2 (derecha) -->
    <circle cx="600" cy="558" r="15"/>
    <rect x="589" y="573" width="22" height="38" rx="6"/>
    <!-- brazo hacia la otra -->
    <rect x="583" y="580" width="6" height="24" rx="3" transform="rotate(-25 583 580)"/>
    <!-- piernas -->
    <rect x="590" y="611" width="8" height="28" rx="3" transform="rotate(-6 590 611)"/>
    <rect x="604" y="611" width="8" height="28" rx="3" transform="rotate(6 604 611)"/>
  </g>

  <!-- Corazón sobre ellos -->
  <g transform="translate(570, 500)" opacity="0.9">
    <path d="M0 8 C-12 -8 -28 0 -28 14 C-28 32 0 48 0 48 C0 48 28 32 28 14 C28 0 12 -8 0 8 Z" fill="#d4a5a5" filter="url(#soft2)"/>
  </g>

  <!-- Estrellas -->
  <g opacity="0.8" fill="#f7e6c8">
    <circle cx="120" cy="120" r="2"/>
    <circle cx="340" cy="90" r="1.5"/>
    <circle cx="600" cy="110" r="2"/>
    <circle cx="780" cy="80" r="1.5"/>
    <circle cx="1050" cy="130" r="2"/>
    <circle cx="480" cy="160" r="1.2"/>
  </g>
</svg>
